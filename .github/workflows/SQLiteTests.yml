name: SQLite Tests
on: 
  push:
  pull_request:
  repository_dispatch:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:

  format-check:
    name: Format Check
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: |
          python -m pip install --user --break-system-packages \
            black==25.1.0        \
            clang_format==11.0.1 \
            cmake-format==0.6.13
          export PATH=~/.local/bin:$PATH
          python -m pip show black
          python -m pip show cmake_format
          python -m pip show clang_format
          which clang-format
          clang-format --version
          make format-check

  linux:
    name: Linux (amd64)
    needs: format-check
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: 'ccache gcc'
      CXX: 'ccache g++'
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Install required ubuntu packages
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate || true
        sudo dpkg-reconfigure man-db || true
        sudo apt-get update -y -q -o=Dpkg::Use-Pty=0
        sudo apt-get install -y -q -o=Dpkg::Use-Pty=0 \
          build-essential \
          libcurl4-openssl-dev \
          libssl-dev \
          ccache \
          cmake \
          ninja-build \
          python3

    - name: Install rclone
      run: |
        # apt's rclone predates `serve s3`; install a pinned recent build for the rclone-backed tests.
        curl -fsSL https://downloads.rclone.org/v1.74.2/rclone-v1.74.2-linux-amd64.zip -o /tmp/rclone.zip
        sudo unzip -oj /tmp/rclone.zip '*/rclone' -d /usr/local/bin
        rclone version

    - name: Cache Key
      id: cache_key
      working-directory: ./duckdb
      run: |
        DUCKDB_VERSION=$(git rev-parse --short=10 HEAD)
        KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
        echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

    - name: Restore Cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Build extension
      env:
        SQLITE_ENABLE_HTTPFS_TESTS: 1
      run: |
        make release

    - name: Save Cache
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Test extension
      env:
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/release/repository/
        SQLITE_TPCH_GENERATED: 1
      run: |
        make data/db/tpch.db
        # Wrap unittest with the local HTTP server so the remote tests (require-env SQLITE_HTTP_TEST_URL)
        # run instead of skipping. The concurrency + s3 tests gate on other env vars and run in the steps below.
        python3 scripts/sqlite_http_test_server.py ./build/release/test/unittest 'test/*'

    - name: Test concurrency (rclone serve http)
      run: |
        # The concurrent-scan and concurrent-lifecycle tests need a robust server; rclone serve http
        # handles them (--server rclone-http sets SQLITE_HTTP_ROBUST so they run).
        python3 scripts/sqlite_http_test_server.py --server rclone-http \
          ./build/release/test/unittest 'test/sql/http_concurrent/*'

    - name: Test s3:// path (rclone serve s3)
      run: |
        # Exercise the s3:// transport + the credentialed -wal/-journal sidecar probe via rclone serve s3.
        python3 scripts/sqlite_http_test_server.py --server rclone-s3 \
          ./build/release/test/unittest 'test/sql/http/http_sqlite_16_s3.test'

  linux-sanitized:
    name: Linux ${{ matrix.sanitizer.name }} (amd64)
    needs: linux
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}

    strategy:
      matrix:
        sanitizer:
        - name: ASan
          threadsan_enabled: 0
        - name: TSan
          threadsan_enabled: 1

    env:
      GEN: ninja
      CC: 'ccache gcc'
      CXX: 'ccache g++'
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:

    - name: Free disk space
      uses: endersonmenezes/free-disk-space@v2.1.1
      continue-on-error: true
      with:
        remove_haskell: true
        remove_tool_cache: true
        remove_folders: "/usr/local/share/powershell /usr/share/swift"
        testing: false

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Install required ubuntu packages
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate || true
        sudo dpkg-reconfigure man-db || true
        sudo apt-get update -y -q -o=Dpkg::Use-Pty=0
        sudo apt-get install -y -q -o=Dpkg::Use-Pty=0 \
          build-essential \
          libcurl4-openssl-dev \
          libssl-dev \
          ccache \
          cmake \
          mold \
          ninja-build \
          python3

    - name: Install rclone
      run: |
        # apt's rclone predates `serve s3`; install a pinned recent build for the rclone-backed tests.
        curl -fsSL https://downloads.rclone.org/v1.74.2/rclone-v1.74.2-linux-amd64.zip -o /tmp/rclone.zip
        sudo unzip -oj /tmp/rclone.zip '*/rclone' -d /usr/local/bin
        rclone version

    - name: Cache Key
      id: cache_key
      working-directory: ./duckdb
      run: |
        DUCKDB_VERSION=$(git rev-parse --short=10 HEAD)
        KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"-relassert-${{ matrix.sanitizer.name }}
        echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

    - name: Restore Cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Build extension
      env:
        SQLITE_ENABLE_HTTPFS_TESTS: 1
        THREADSAN: ${{ matrix.sanitizer.threadsan_enabled }}
      run: |
        make relassert
        cat ./build/relassert/build.ninja | grep fsanitize | head -n 1

    - name: Save Cache
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Test extension
      env:
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/relassert/repository/
      run: |
        # Run under the local HTTP server so the remote tests run (not skip) under the sanitizers --
        # this exercises the VFS lifetime/refcount paths under ASan/TSan.
        python3 scripts/sqlite_http_test_server.py ./build/relassert/test/unittest

    - name: Test concurrency under sanitizer (rclone serve http)
      run: |
        # The concurrency tests under the sanitizers: many contexts register/open/scan/unregister at once,
        # contending the VFS registry to surface races / use-after-free in the retire-then-reap path.
        python3 scripts/sqlite_http_test_server.py --server rclone-http \
          ./build/relassert/test/unittest 'test/sql/http_concurrent/*'
